[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
test    = "test"
script  = "script"

# Solidity compiler settings
solc_version = "0.8.20"
optimizer    = true
optimizer_runs = 200

# Verbosity: 0-5 (2 = show logs, 3 = show traces on failure)
verbosity = 2

# Gas reporting
gas_reports = ["SavingsBank"]

[profile.ci]
verbosity = 3
fuzz = { runs = 500 }

[fuzz]
runs = 256
seed = "0x1"

[invariant]
runs   = 64
depth  = 15

[fmt]
line_length  = 100
tab_width    = 4
quote_style  = "double"